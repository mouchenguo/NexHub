name: Build Windows Release

on:
  # 发布由本地脚本打包、校验哈希后手工上传，避免 tag 推送自动覆盖 Release 资产。
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: client
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Build NexHub.exe
        working-directory: client
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name NexHub --icon "nexhub\resources\nexhub.ico" --add-data "nexhub\resources;nexhub\resources" --collect-all qfluentwidgets --hidden-import nexhub.plugin_host --hidden-import nexhub.services.memory_optimizer --hidden-import nexhub.npc_admin --hidden-import win32crypt main.py

      - name: Prepare single release executable
        shell: pwsh
        run: |
          $version = (Select-String -Path "client/nexhub/paths.py" -Pattern 'VERSION = "([^"]+)"').Matches.Groups[1].Value
          Move-Item "client/dist/NexHub.exe" "client/dist/NexHub-v$version.exe" -Force
          $exes = @(Get-ChildItem "client/dist" -Filter "*.exe")
          if ($exes.Count -ne 1) {
            throw "Expected exactly one release exe, found $($exes.Count)"
          }
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Refresh release manifest checksums
        shell: pwsh
        run: |
          $exe = "client/dist/NexHub-v$env:VERSION.exe"
          $exeSha = (Get-FileHash $exe -Algorithm SHA256).Hash
          $serverSha = (Get-FileHash "release/NexHub-Server-Deploy.zip" -Algorithm SHA256).Hash
          $env:NEXHUB_EXE_SHA = $exeSha
          $env:NEXHUB_SERVER_SHA = $serverSha
          python -c "import json, os, pathlib; p = pathlib.Path('release/latest.json'); d = json.loads(p.read_text(encoding='utf-8')); d['sha256'] = os.environ['NEXHUB_EXE_SHA']; d['server_sha256'] = os.environ['NEXHUB_SERVER_SHA']; p.write_text(json.dumps(d, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')"
          Write-Host "Client SHA256: $exeSha"
          Write-Host "Server SHA256: $serverSha"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexHub-Windows
          path: client/dist/NexHub-v${{ env.VERSION }}.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: NexHub ${{ env.VERSION }}
          prerelease: ${{ !startsWith(env.VERSION, '1.0.0') }}
          files: |
            client/dist/NexHub-v${{ env.VERSION }}.exe
            release/NexHub-Server-Deploy.zip
            release/NexHub-Server-Bundle.zip
            release/index.html
            release/latest.json
          generate_release_notes: true

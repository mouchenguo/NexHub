<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>登录我的网盘 · NexHub</title>
    <style>
        :root { color-scheme: light; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
               font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
               background: linear-gradient(160deg, #eef4ff 0%, #f7f9fc 55%, #eefaf4 100%); color: #0f172a; }
        .card { width: 380px; background: #fff; border-radius: 16px; padding: 30px 28px;
                box-shadow: 0 18px 50px rgba(15, 23, 42, .12); }
        .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
        .mark { width: 34px; height: 34px; border-radius: 10px; background: #2563eb; color: #fff;
                display: grid; place-items: center; font-weight: 700; }
        h1 { font-size: 19px; margin: 6px 0 4px; }
        p.sub { margin: 0 0 20px; font-size: 12.5px; color: #64748b; }
        label { display: block; font-size: 12.5px; color: #475569; margin-bottom: 6px; }
        input[type=text], input[type=password] { width: 100%; padding: 10px 12px; font-size: 14px;
                border: 1px solid #d8e0ea; border-radius: 9px; outline: none; }
        input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, .12); }
        .field { margin-bottom: 14px; }
        button { width: 100%; padding: 11px; font-size: 14px; font-weight: 600; color: #fff;
                 background: #2563eb; border: none; border-radius: 9px; cursor: pointer; }
        button:hover { background: #1d4ed8; }
        .error { background: #fdecec; color: #b42318; border-radius: 9px; padding: 9px 11px;
                 font-size: 12.5px; margin-bottom: 14px; }
        .hint { margin-top: 16px; font-size: 11.5px; color: #94a3b8; line-height: 1.7; }
        a { color: #2563eb; text-decoration: none; }
    </style>
</head>
<body>
<div class="card">
    <div class="brand"><span class="mark">N</span><strong>NexHub</strong></div>
    <h1>登录我的网盘</h1>
    <p class="sub">与客户端相同的账号；登录后可在网页管理文件与分享链接。</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post" action="/drive/login">
        <div class="field">
            <label for="username">用户名或昵称</label>
            <input id="username" type="text" name="username" value="{{ username }}" autocomplete="username" required autofocus>
        </div>
        <div class="field">
            <label for="password">密码</label>
            <input id="password" type="password" name="password" autocomplete="current-password" required>
        </div>
        <button type="submit">登录</button>
    </form>
    <p class="hint">还没有账号？请在 NexHub 客户端注册，或在 <a href="/nexhub">官网</a> 查看说明。<br>
        网盘文件保存在服务器 OSS，占用你的 OSS 配额。</p>
</div>
</body>
</html>
